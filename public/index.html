<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<title>롤가다 · 협곡에 인생 건 롤대남들</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050a14;--panel:#0b1424;--panel2:#101c31;--glass:rgba(255,255,255,.035);
  --line:rgba(200,170,110,.18);--line2:rgba(255,255,255,.08);
  --gold:#c8aa6e;--gold2:#f3dca4;--teal:#0ac8b9;--teal2:#6ff7ea;--pink:#ff4d9d;--lime:#b6ff3b;
  --red:#ff5468;--amber:#ffc24d;--violet:#8f7bff;--txt:#eaf1fb;--mut:#8796ad;--mut2:#5c6b82;
  --r:18px;--shadow:0 12px 34px rgba(0,0,0,.38)
}
html{scroll-behavior:smooth}
body{min-height:100vh;background:var(--bg);color:var(--txt);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 520px at 0% -5%,rgba(10,200,185,.17),transparent 60%),
  radial-gradient(800px 480px at 105% 0%,rgba(255,77,157,.13),transparent 60%),
  radial-gradient(800px 600px at 50% 115%,rgba(200,170,110,.12),transparent 60%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 0%,#000,transparent 75%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
input:disabled,select:disabled{opacity:.6;cursor:not-allowed}
a{color:var(--teal2)}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 90px}
.hidden{display:none!important}
.row{display:flex;align-items:center}.gap{gap:8px}.wrapr{flex-wrap:wrap}
.mla{margin-left:auto}

/* ===== header ===== */
.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(5,10,20,.75);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand img{width:40px;height:40px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 1px var(--line),0 0 18px rgba(10,200,185,.35)}
.brand b{display:block;font-weight:900;letter-spacing:.06em;font-size:18px;background:linear-gradient(90deg,var(--gold2),var(--gold) 45%,var(--teal2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.top-r{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--glass);font-size:12px;font-weight:800;white-space:nowrap}
button.pill:hover{border-color:rgba(255,255,255,.22)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut2);flex:none}
.dot.live{background:var(--lime);box-shadow:0 0 10px var(--lime);animation:pulse 1.8s infinite}
.dot.err{background:var(--red)}.dot.wait{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 10px;max-width:1280px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 15px;border-radius:12px;font-weight:800;color:var(--mut);white-space:nowrap;border:1px solid transparent;transition:.2s}
.tab:hover{color:var(--txt);background:var(--glass)}
.tab.on{color:#04121a;background:linear-gradient(135deg,var(--teal2),var(--teal));box-shadow:0 6px 20px rgba(10,200,185,.35)}

/* ===== common ===== */
.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));border:1px solid var(--line2);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.h1{font-size:24px;font-weight:900;letter-spacing:-.01em}
.h2{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.h3{font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.sub{color:var(--mut);font-size:12.5px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:12px;font-weight:800;font-size:13px;border:1px solid var(--line2);background:var(--panel2);transition:transform .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:rgba(255,255,255,.22);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--teal2),var(--teal));color:#04121a;border:0;box-shadow:0 8px 22px rgba(10,200,185,.3)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d1407;border:0;box-shadow:0 8px 22px rgba(200,170,110,.25)}
.btn.pink{background:linear-gradient(135deg,#ff8cc0,var(--pink));color:#fff;border:0;box-shadow:0 8px 22px rgba(255,77,157,.28)}
.btn.danger{color:var(--red);border-color:rgba(255,84,104,.32)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.inp{background:rgba(0,0,0,.28);border:1px solid var(--line2);border-radius:11px;padding:8px 11px;outline:none;transition:.15s;min-width:0}
.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,200,185,.18)}
.inp.num{width:74px;text-align:center;font-weight:900}
select.inp{cursor:pointer}
select.inp option{background:#0b1424}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--glass);font-size:12px;font-weight:800;color:var(--mut);transition:.15s;white-space:nowrap}
.chip:hover:not(:disabled){color:var(--txt)}
.chip.on{color:#04121a;background:var(--teal2);border-color:transparent}
.chip.on.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d1407}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line2)}
.seg button{padding:6px 11px;border-radius:9px;font-weight:800;font-size:12px;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.seg.big button{padding:9px 16px;font-size:13px}
.seg.big button.on{background:linear-gradient(135deg,var(--teal2),var(--teal));color:#04121a}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:rgba(0,0,0,.28)}
.stepper button{width:32px;height:34px;font-weight:900;font-size:16px;color:var(--teal2)}
.stepper button:hover:not(:disabled){background:rgba(10,200,185,.12)}
.stepper b,.stepper input{min-width:34px;width:44px;text-align:center;font-weight:900;background:none;border:0;outline:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}
.t-gold{background:rgba(200,170,110,.16);color:var(--gold2)}
.t-teal{background:rgba(10,200,185,.15);color:var(--teal2)}
.t-pink{background:rgba(255,77,157,.15);color:#ff8cc0}
.t-lime{background:rgba(182,255,59,.13);color:var(--lime)}
.t-red{background:rgba(255,84,104,.15);color:#ff8795}
.t-amber{background:rgba(255,194,77,.14);color:var(--amber)}
.t-mut{background:rgba(255,255,255,.06);color:var(--mut)}
.t-violet{background:rgba(143,123,255,.16);color:#b9adff}
.empty-note{color:var(--mut);font-size:13px;text-align:center;padding:22px 8px}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.35);border:1px solid var(--line2);padding:2px 8px;border-radius:7px;font-weight:700}

/* ===== home ===== */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:30px;border:1px solid var(--line);
  background:linear-gradient(135deg,rgba(10,200,185,.14),rgba(11,20,36,.65) 45%,rgba(255,77,157,.12));display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;box-shadow:var(--shadow)}
.hero::after{content:"롤가다";position:absolute;right:-12px;bottom:-34px;font-size:150px;font-weight:900;letter-spacing:.05em;color:rgba(255,255,255,.025);pointer-events:none;line-height:1}
.logo-wrap{position:relative;width:156px;height:156px;flex:none}
.logo-wrap::before{content:"";position:absolute;inset:-12px;border-radius:44px;background:conic-gradient(from 0deg,var(--teal),var(--gold),var(--pink),var(--violet),var(--teal));filter:blur(16px);opacity:.6;animation:spin 7s linear infinite}
.logo-wrap img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:34px;box-shadow:0 0 0 2px rgba(200,170,110,.55),0 18px 50px rgba(0,0,0,.5);animation:float 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-6px)}}
.hero .eyebrow{font-size:13px;font-weight:900;letter-spacing:.06em;color:var(--teal2)}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:900;letter-spacing:.02em;line-height:1.02;margin:6px 0 8px;background:linear-gradient(90deg,#fff 10%,var(--gold2) 45%,var(--teal2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:#c5d1e2;font-size:15px;font-weight:600}
.hero .pills{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 18px}
.dbar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px;max-width:420px}
.dbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--gold),var(--pink))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.stat{padding:16px 18px;border-radius:var(--r);border:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));position:relative;overflow:hidden}
.stat .k{font-size:12px;color:var(--mut);font-weight:800}
.stat .v{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.stat .v small{font-size:14px;color:var(--mut);font-weight:800;margin-left:3px}
.stat .e{position:absolute;right:12px;top:10px;font-size:26px;opacity:.85}
.home-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.r-ops .r-t,.r-team .r-o{display:none}
.brd-p{border:1px solid var(--line2);border-radius:14px;padding:12px 14px;margin-top:8px;background:var(--panel2)}
.brd-p summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}.brd-p summary::-webkit-details-marker{display:none}
.brd-p summary b{font-size:15px}.brd-p summary .sub{margin-left:auto}
.brd-b{white-space:pre-wrap;word-break:break-word;margin-top:10px;line-height:1.6}
.stats.h-stats{grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}
.h-stats+.card{margin-bottom:14px}
.h-stats~.home-grid{grid-template-columns:1fr 1fr}
.h-stats~.home-grid>.card:last-child:nth-child(odd){grid-column:1/-1}
.h-stats~.home-grid .h-aw{grid-template-columns:1fr 1fr}
.h-stats~.home-grid .h-aw>.g-award:last-child:nth-child(odd){grid-column:1/-1}
.h-stats .stat{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.h-stats .stat .e{position:static;font-size:24px}
.h-stats .stat .v{height:40px;display:flex;align-items:center;justify-content:center}
.h-stats .stat .v.t{font-size:22px}
.tsbar{margin-bottom:6px}
.rg-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.rg-top>.card{margin:0}
.rg-slot{display:grid;grid-template-columns:78px minmax(0,1fr) auto 22px;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line2);border-radius:12px;margin-top:6px;cursor:pointer;background:rgba(255,255,255,.02)}
.rg-slot.on{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(200,170,110,.22)}
.rg-slot .ln{font-weight:800;font-size:13px}
.rg-slot .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg-slot .sc{font-weight:900;font-size:16px;min-width:40px;text-align:right;color:var(--gold2)}
.rg-slot .x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;padding:0}
.rg-sum{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);font-weight:800}
.rg-sum b{font-size:24px;font-weight:900}.rg-sum b small{font-size:14px;color:var(--mut)}
.rg-sum.over b{color:var(--red)}.rg-sum.ok b{color:var(--lime)}
.rg-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.rg-t{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02)}
.rg-t .hd{padding:7px 12px;font-weight:900;color:#0b0f17;text-align:center}
.rg-t .r{display:flex;justify-content:space-between;gap:6px;padding:4px 12px;font-size:13px}
.rg-t .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line2);font-weight:800}
.rg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.rg-p{text-align:left;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:rgba(255,255,255,.03);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit}
.rg-p:hover{border-color:var(--teal2)}
.rg-p.in{border-color:var(--gold2);background:rgba(200,170,110,.08)}
.rg-p.taken{opacity:.4;cursor:not-allowed}
.rg-p .t{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800}
.rg-p .s{font-size:19px;font-weight:900;color:var(--gold2)}
.rg-p .m{font-size:11.5px;color:var(--mut)}
@media(max-width:860px){.rg-top{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:18px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bar .col{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--teal2),rgba(10,200,185,.25));position:relative;transition:height .6s cubic-bezier(.2,.8,.2,1);min-height:4px}
.bar .col.zero{background:rgba(255,255,255,.06)}
.bar .col b{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900}
.bar span{font-size:11.5px;color:var(--mut);font-weight:800}
.bar:hover .col:not(.zero){background:linear-gradient(180deg,var(--gold2),rgba(200,170,110,.3))}
.supply{display:grid;gap:9px}
.sup{display:grid;grid-template-columns:72px 1fr 70px;align-items:center;gap:10px;font-weight:800;font-size:13px}
.sup .track{height:10px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.sup .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.sup .track i.any{background:rgba(10,200,185,.25)}
.sup .track i.first{background:linear-gradient(90deg,var(--teal),var(--teal2))}
.sup .need{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold2);box-shadow:0 0 8px var(--gold)}
.sup em{font-style:normal;text-align:right;font-size:12px}
.tipbox{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);border:1px dashed rgba(255,77,157,.35);background:rgba(255,77,157,.06);margin-top:14px}
.tipbox .tt{flex:1;font-weight:700}
.toplist{display:grid;gap:8px}
.trow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line2);font-weight:800}
.trow .rk{width:26px;text-align:center;font-size:16px}
.trow .sc{margin-left:auto;font-size:18px;font-weight:900;color:var(--gold2)}

/* ===== roster ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px;padding:14px}
.search{flex:1;min-width:180px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.mcard{min-width:0;position:relative;border-radius:var(--r);padding:14px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));display:grid;gap:10px;transition:.2s}
.mcard:hover{border-color:rgba(10,200,185,.35)}
.mcard.off{opacity:.5;filter:saturate(.3)}
.mcard.orderer{border-color:rgba(200,170,110,.45);box-shadow:0 0 0 1px rgba(200,170,110,.15),0 10px 30px rgba(200,170,110,.08)}
.mc-top{display:flex;gap:8px;align-items:center}
.mc-top .nm{flex:1;width:100%;min-width:0;font-weight:900;font-size:16px;background:transparent;border:1px solid transparent;padding:4px 8px;margin-left:-8px}
.mc-top .nm:hover:not(:disabled){border-color:var(--line2)}
.tog{padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:900;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.tog.on{background:rgba(182,255,59,.14);color:var(--lime);border-color:rgba(182,255,59,.35)}
.mc-score{display:flex;align-items:center;gap:12px}
.mc-score .big{font-size:38px;font-weight:900;line-height:1;min-width:48px;background:linear-gradient(180deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mc-score .lbl{font-size:11px;color:var(--mut);font-weight:800;line-height:1.35}
.mc-score .badges{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mc-f{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center;font-size:12px;color:var(--mut);font-weight:800}
.mc-f select{width:100%;min-width:0;text-overflow:ellipsis;font-size:12.5px;padding:6px 8px}
.prefs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.pf{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.2);font-size:11px;font-weight:800;color:var(--mut);transition:.15s}
.pf span{font-size:15px;filter:grayscale(1);opacity:.6;transition:.15s}
.pf.on{border-color:rgba(10,200,185,.5);color:var(--txt);background:rgba(10,200,185,.1)}
.pf.on span{filter:none;opacity:1}
.pf i{position:absolute;top:-6px;right:-4px;width:17px;height:17px;border-radius:50%;background:var(--teal2);color:#04121a;font-style:normal;font-size:10px;font-weight:900;display:grid;place-items:center}
.pf.on.p1 i{background:var(--gold2)}
.mc-bot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lanes{display:flex;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--mut);font-weight:700;border-top:1px dashed var(--line2);padding-top:8px}
.lanes span{padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.04)}
.lanes span b{color:var(--txt);margin-left:3px}
.lanes span.best{background:rgba(200,170,110,.14);color:var(--gold2)}
.del{margin-left:auto;width:30px;height:30px;border-radius:9px;color:var(--mut);display:grid;place-items:center}
.del:hover:not(:disabled){background:rgba(255,84,104,.15);color:var(--red)}

/* ===== build ===== */
.build-tb .ctl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--mut)}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.sm-t{padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.03)}
.sm-t .k{font-size:11.5px;color:var(--mut);font-weight:800}
.sm-t .v{font-size:22px;font-weight:900;line-height:1.25}
.sm-t.grade{background:linear-gradient(135deg,rgba(10,200,185,.12),rgba(255,77,157,.08));border-color:rgba(10,200,185,.28)}
.feas{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:14px;margin-bottom:14px;border:1px solid rgba(255,194,77,.4);background:rgba(255,194,77,.08);font-weight:700}
.feas b{color:var(--amber)}
.selbar{position:sticky;top:112px;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;margin-bottom:12px;background:linear-gradient(135deg,rgba(10,200,185,.95),rgba(80,230,215,.95));color:#04121a;font-weight:800;box-shadow:0 10px 30px rgba(10,200,185,.35);animation:drop .25s}
.selbar .btn{margin-left:auto;background:rgba(0,0,0,.18);border:0;color:#04121a}
@keyframes drop{from{transform:translateY(-8px);opacity:0}}
.build{display:grid;grid-template-columns:262px 1fr;gap:14px;align-items:start}
.bench{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto;padding:14px;transition:.2s}
.bench.drop{border-color:rgba(255,77,157,.5);box-shadow:0 0 0 2px rgba(255,77,157,.25)}
.bench .cnt{margin-left:auto;font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(10,200,185,.15);color:var(--teal2)}
.bench-list{display:grid;gap:6px;margin-top:10px}
.pchip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.035);cursor:grab;font-weight:800;transition:.15s;user-select:none;-webkit-user-select:none}
.pchip:hover{border-color:rgba(10,200,185,.45);transform:translateX(2px)}
.pchip.sel{border-color:var(--teal2);background:rgba(10,200,185,.14);box-shadow:0 0 0 2px rgba(111,247,234,.3)}
.pchip .pp{font-size:12px;color:var(--mut);display:flex;gap:2px}
.pchip .bs{margin-left:auto;font-weight:900;color:var(--gold2)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px}
.tcard{border-radius:var(--r);border:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));overflow:hidden;box-shadow:var(--shadow);position:relative}
.tcard.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.94);opacity:.3}}
.tcard .strip{height:4px}
.th{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.th input[type=color]{width:26px;height:26px;border:0;border-radius:8px;background:none;padding:0;cursor:pointer;flex:none}
.th input[type=color]::-webkit-color-swatch-wrapper{padding:0}.th input[type=color]::-webkit-color-swatch{border:0;border-radius:8px}
.th .tn{flex:1;font-weight:900;font-size:15px;background:transparent;border:1px solid transparent;padding:4px 6px}
.th .tn:hover:not(:disabled){border-color:var(--line2)}
.tscore{padding:2px 12px 10px}
.tscore .nums{display:flex;align-items:baseline;gap:6px}
.tscore .nums b{font-size:30px;font-weight:900;line-height:1}
.tscore .nums small{color:var(--mut);font-weight:800}
.tscore .nums .tag{margin-left:auto}
.gauge{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:7px}
.gauge i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.slots{display:grid;gap:6px;padding:0 10px 12px}
.slot{display:grid;grid-template-columns:64px 1fr auto 26px;align-items:center;gap:6px;padding:7px 6px 7px 9px;border-radius:12px;background:rgba(0,0,0,.18);border:1px solid var(--line2);cursor:pointer;transition:.15s;min-height:46px}
.slot:hover{border-color:rgba(10,200,185,.45)}
.slot.sel{border-color:var(--teal2);box-shadow:0 0 0 2px rgba(111,247,234,.35),0 0 18px rgba(10,200,185,.3);background:rgba(10,200,185,.1)}
.slot.target{border-style:dashed;border-color:rgba(10,200,185,.35)}
.slot.locked{background:rgba(200,170,110,.07);border-color:rgba(200,170,110,.3)}
.slot .sp{display:flex;flex-direction:column;line-height:1.15}
.slot .sp b{font-size:12.5px}
.slot .sp em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--mut)}
.slot .sp em.plus{color:var(--lime)}.slot .sp em.minus{color:#ff8cc0}
.slot .sn{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px;min-width:0}
.slot .sn .nmx{overflow:hidden;text-overflow:ellipsis}
.slot .ss{font-weight:900;font-size:16px;color:var(--gold2);min-width:22px;text-align:right}
.slot .emp{color:var(--mut2);font-weight:800;font-size:12.5px}
.slot .lk{width:26px;height:26px;border-radius:8px;font-size:13px;opacity:.45;display:grid;place-items:center}
.slot .lk:hover:not(:disabled){opacity:1;background:rgba(255,255,255,.06)}
.slot .lk.on{opacity:1}
.fit{font-size:9.5px;font-weight:900;padding:1px 6px;border-radius:99px;flex:none}
.f-1{background:rgba(182,255,59,.14);color:var(--lime)}
.f-2{background:rgba(255,194,77,.14);color:var(--amber)}
.f-off{background:rgba(255,84,104,.16);color:#ff8795}
.f-none{background:rgba(255,255,255,.06);color:var(--mut)}
.f-out{background:rgba(255,84,104,.3);color:#fff}
.tcard .badge-rank{position:absolute;top:14px;right:12px;font-size:11px}

/* ===== bracket ===== */
.stand{width:100%;border-collapse:separate;border-spacing:0 6px}
.stand th{font-size:11.5px;color:var(--mut);font-weight:800;text-align:center;padding:0 8px}
.stand th:nth-child(2){text-align:left}
.stand td{padding:10px 8px;background:rgba(255,255,255,.035);text-align:center;font-weight:800}
.stand td:first-child{border-radius:12px 0 0 12px;width:44px;font-size:17px}
.stand td:last-child{border-radius:0 12px 12px 0}
.stand td.tnm{text-align:left}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
.wr{display:inline-block;min-width:48px;padding:3px 8px;border-radius:8px;background:rgba(10,200,185,.12);color:var(--teal2)}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rcard{padding:12px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.03)}
.rcard h4{font-size:12.5px;color:var(--mut);margin-bottom:8px;font-weight:900}
.mrow{display:grid;grid-template-columns:1fr 26px 1fr;align-items:center;gap:6px;margin-bottom:6px}
.mrow .vs{text-align:center;font-size:11px;font-weight:900;color:var(--mut2)}
.mt{padding:9px 10px;border-radius:11px;border:1px solid var(--line2);background:rgba(0,0,0,.2);font-weight:800;font-size:13px;text-align:left;display:flex;align-items:center;gap:6px;min-width:0;transition:.15s}
.mt span.nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt:hover:not(:disabled){border-color:rgba(10,200,185,.45)}
.mt.win{background:linear-gradient(135deg,rgba(182,255,59,.18),rgba(10,200,185,.12));border-color:rgba(182,255,59,.45)}
.mt.win::after{content:"WIN";margin-left:auto;font-size:9.5px;font-weight:900;color:var(--lime)}
.mt.lose{opacity:.38;text-decoration:line-through}
.mt.win:disabled{opacity:1}
.mt.bye{opacity:.4;font-style:italic}
.tour{display:flex;gap:26px;overflow-x:auto;padding:4px 2px 16px}
.tcol{display:flex;flex-direction:column;min-width:220px;flex:1}
.tcol h4{text-align:center;font-size:12px;font-weight:900;color:var(--teal2);letter-spacing:.06em;margin-bottom:10px}
.tcol .tbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.tmatch{display:grid;gap:5px;padding:8px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.03);position:relative}
.tmatch .mt{width:100%}
.champ{margin-top:16px;text-align:center;padding:26px;border-radius:22px;border:1px solid rgba(200,170,110,.5);background:radial-gradient(circle at 50% 0%,rgba(243,220,164,.25),transparent 70%),rgba(200,170,110,.06);box-shadow:0 0 50px rgba(200,170,110,.15);animation:pop .6s both}
.champ .cr{font-size:48px;filter:drop-shadow(0 6px 18px rgba(200,170,110,.6))}
.champ .cn{font-size:clamp(26px,5vw,40px);font-weight:900;background:linear-gradient(90deg,var(--gold2),#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== rules ===== */
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.rules .card.full{grid-column:1/-1}
.rl{display:grid;gap:8px}
.rl li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line2)}
.rl li .ic{font-size:17px;line-height:1.3}
.rl li b{display:block}
.rl li p{color:var(--mut);font-size:12.5px}
.note{font-size:12px;color:var(--mut);padding:8px 12px;border-left:3px solid var(--gold);background:rgba(200,170,110,.06);border-radius:0 10px 10px 0;margin-top:10px}
.ttable{width:100%;border-collapse:collapse}
.ttable td,.ttable th{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left;font-weight:700}
.ttable th{font-size:11.5px;color:var(--mut)}
.ttable td.s{font-weight:900;font-size:16px;color:var(--gold2);text-align:right;width:70px}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lad{padding:12px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.03);text-align:center}
.lad b{display:block;font-size:22px;font-weight:900;color:var(--teal2)}
.lad span{font-size:11.5px;color:var(--mut);font-weight:800}
.lad.on{border-color:var(--teal2);background:rgba(10,200,185,.1)}
.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:12px;border-radius:12px;background:rgba(0,0,0,.2)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stp{padding:12px;border-radius:12px;text-align:center;border:1px solid var(--line2)}
.stp b{display:block;font-size:13px}.stp span{font-size:12px;color:var(--mut);font-weight:700}
.stp.s1{background:rgba(255,194,77,.08)}.stp.s2{background:rgba(255,120,80,.1)}.stp.s3{background:rgba(255,84,104,.14)}
.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.aw{text-align:center;padding:16px 8px;border-radius:14px;border:1px solid var(--line2)}
.aw .m{font-size:34px}.aw b{display:block;font-weight:900}
.aw.g{border-color:rgba(243,220,164,.5);background:rgba(243,220,164,.07)}
.linkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line2);margin-bottom:8px;flex-wrap:wrap}
.linkrow .lk-l{font-size:12px;color:var(--mut);font-weight:800;width:90px}
.linkrow a,.linkrow code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}

/* ===== settings ===== */
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sets .full{grid-column:1/-1}
.setrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line2);flex-wrap:wrap}
.setrow:last-child{border:0}
.setrow .lb{flex:1;min-width:160px;font-weight:800}
.setrow .lb small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.switch{width:48px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--teal)}.switch.on::after{left:23px}
.notes{width:100%;border-collapse:separate;border-spacing:0 5px}
.notes td{padding:8px 10px;background:rgba(255,255,255,.03);font-weight:800}
.notes td:first-child{border-radius:10px 0 0 10px}.notes td:last-child{border-radius:0 10px 10px 0}
.notes th{font-size:11.5px;color:var(--mut);text-align:left;padding:0 10px}
.mini{display:inline-flex;align-items:center;gap:4px}
.mini button{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.06);font-weight:900}
.mini b{min-width:18px;text-align:center}

/* ===== modal & toast ===== */
.modal{position:fixed;inset:0;z-index:100;background:rgba(2,5,12,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{width:100%;max-width:440px;max-height:86vh;overflow:auto;border-radius:22px;padding:22px;background:linear-gradient(180deg,#132239,#0b1424);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .3s both}
.mh{font-size:18px;font-weight:900;margin-bottom:4px}
.mp{color:#c5d1e2;margin:10px 0 18px;white-space:pre-line}
.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.plist{display:grid;gap:6px;margin-top:12px}
.prow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.035);font-weight:800;text-align:left}
.prow:hover{border-color:var(--teal)}
.prow .ps{margin-left:auto;color:var(--gold2);font-weight:900}
.pin{width:100%;font-size:28px;letter-spacing:.5em;text-align:center;font-weight:900;padding:12px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:grid;gap:8px;justify-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{padding:12px 18px;border-radius:14px;background:rgba(16,28,49,.96);border:1px solid rgba(10,200,185,.4);font-weight:800;box-shadow:0 14px 40px rgba(0,0,0,.5);transform:translateY(16px);opacity:0;transition:.3s;max-width:520px;text-align:center}
.toast.in{transform:none;opacity:1}
.toast.err{border-color:rgba(255,84,104,.55)}
.foot{text-align:center;color:var(--mut2);font-size:12px;margin-top:34px}

/* ===== responsive ===== */
@media(max-width:980px){
  .home-grid,.h-stats~.home-grid,.rules,.sets{grid-template-columns:1fr}
  .summary{grid-template-columns:repeat(3,1fr)}
  .build{grid-template-columns:1fr}
  .bench{position:static;max-height:none}
  .bench-list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .selbar{top:104px}
}
@media(max-width:640px){
  .wrap{padding:14px 12px 90px}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center;padding:24px 18px}
  .hero .pills{justify-content:center}.dbar{margin:6px auto 0}
  .logo-wrap{width:112px;height:112px}
  .brand small{display:none}
  .top-r .pill .lbtxt{display:none}
  .summary{grid-template-columns:repeat(2,1fr)}
  .summary .grade{grid-column:1/-1}
  .h1{font-size:21px}
  .steps,.awards{grid-template-columns:1fr}
  .ladder{grid-template-columns:1fr 1fr 1fr}
  .stats,.stats.h-stats{grid-template-columns:1fr 1fr}
  .stat .v{font-size:26px}
}

/* ===== v2 additions ===== */
.chip.on.adj{background:linear-gradient(135deg,#d8ccff,var(--violet));color:#120a33}
.chip.on.adj.neg{background:linear-gradient(135deg,#ffb3d2,var(--pink));color:#33061a}
.pf.no{border-color:rgba(255,84,104,.5);background:rgba(255,84,104,.1);color:#ff8795}
.pf.no span{filter:none;opacity:.5}
.pf.no i{background:var(--red);color:#fff}
.mc-adj{display:flex;flex-wrap:wrap;gap:5px}
.mc-adj .chip{font-size:11.5px;padding:5px 9px}
.lanes .pbtn{margin-left:auto;padding:3px 9px;border-radius:8px;background:rgba(10,200,185,.12);color:var(--teal2);font-weight:900;font-size:11px}
.lanes .pbtn:hover:not(:disabled){background:rgba(10,200,185,.22)}
.lanes .del{margin-left:0;width:26px;height:26px}
.lanes span.no{background:rgba(255,84,104,.1);color:#ff8795;text-decoration:line-through}
.posm{display:grid;gap:8px;margin-top:14px}
.pmr{display:grid;grid-template-columns:78px minmax(0,1fr) 70px 54px;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line2)}
.pmr select{width:100%}
.pmr .num{width:100%}
.pmv{text-align:right;font-weight:900;font-size:18px;color:var(--gold2)}
.pmv small{font-size:11px;color:var(--mut);margin-left:1px}
.pmh{display:grid;grid-template-columns:78px minmax(0,1fr) 70px 54px;gap:8px;font-size:11px;color:var(--mut);font-weight:800;padding:0 10px;margin-top:12px}
.cfg{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.cfg .full{grid-column:1/-1}
.cfg-list{display:grid;gap:7px;margin-bottom:12px}
.cfg-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line2);flex-wrap:wrap}
.cfg-row .grow{flex:1;min-width:120px}
.cfg-row .grow2{flex:2;min-width:150px}
.cfg-row .emo{width:52px;text-align:center;font-size:16px;padding:6px}
.ord{display:flex;flex-direction:column}
.ord button{font-size:9px;line-height:1;padding:3px 5px;color:var(--mut);border-radius:5px}
.ord button:hover:not(:disabled){color:var(--teal2);background:rgba(255,255,255,.05)}
.posb{display:grid;gap:8px}
.posb .cfg-row b{flex:1}
.vpos{color:var(--lime)}.vneg{color:#ff8cc0}.vzero{color:var(--mut)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:900;font-size:15px;padding:12px;border-radius:12px;background:rgba(0,0,0,.25)}
.formula .op{color:var(--mut)}
.ex{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.ex div{padding:10px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line2);text-align:center;font-size:12px;color:var(--mut);font-weight:800}
.ex div b{display:block;font-size:22px;color:var(--gold2)}
/* sheet */
.sheet-wrap{position:relative;overflow:hidden;width:100%}
.sheet{width:880px;transform-origin:top left;padding:22px;border-radius:22px;background:linear-gradient(160deg,#0f1d33,#070d19 55%,#1b0f1f);border:1px solid var(--line);box-shadow:var(--shadow)}
.sh-head{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sh-head img{width:56px;height:56px;border-radius:16px;box-shadow:0 0 0 1px var(--line)}
.sh-head b{display:block;font-size:26px;font-weight:900;letter-spacing:.04em;background:linear-gradient(90deg,var(--gold2),var(--gold) 45%,var(--teal2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.sh-head span{display:block;color:#c5d1e2;font-weight:800;font-size:13px}
.sh-meta{margin-left:auto;text-align:right;font-size:12px;color:var(--mut);font-weight:800;line-height:1.6}
.sh-t{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.sh-t th{font-size:11px;color:var(--mut);padding:7px 4px;border-bottom:1px solid var(--line2);text-align:center;font-weight:800}
.sh-t td{padding:0 4px;height:32px;text-align:center;font-weight:800;border-bottom:1px solid rgba(255,255,255,.045);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-t tbody tr.r:nth-child(even) td{background:rgba(255,255,255,.022)}
.sh-t .l{text-align:left}
.sh-t .rk{color:var(--mut)}
.sh-t .tier{color:#b9c6da;font-size:12px;font-weight:700}
.sh-t .tot{color:var(--gold2);font-size:15px;font-weight:900}
.sh-t .adjc{font-size:12px}
.sh-t .lane span{display:inline-block;min-width:28px;padding:2px 0;border-radius:7px}
.sh-t .lane.p1 span{background:#ff3b52;color:#fff;font-weight:900;box-shadow:0 0 10px rgba(255,59,82,.45)}
.sh-t .lane.p2 span{background:rgba(255,204,51,.2);color:#ffd84d;font-weight:900}
.sh-t .lane.no span{color:var(--mut2)}
.sh-t tr.off td{opacity:.42}
.sh-t tr.grp td{text-align:left;color:var(--teal2);font-size:12.5px;font-weight:900;height:30px;padding-top:8px;border-bottom:1px solid rgba(10,200,185,.28);background:none}

}

  o.posB={...DEF_POSB};if(src.posB&&ver>=3)POS.forEach(P=>o.posB[P.k]=num(src.posB[P.k],DEF_POSB[P.k]));
  const tk=new Set(o.tiers.map(t=>t.k)),ak=new Set(o.adjs.map(a=>a.id));
  o.players=(Array.isArray(src.players)?src.players:d.players).map(p=>{
    let adj=Array.isArray(p.adj)?p.adj:[...(p.order?['order']:[]),...(+p.judge===1?['jp']:+p.judge===-1?['jm']:[])];

  }).filter(p=>Number.isFinite(p.id));
  const ids=new Set(o.players.map(p=>p.id));

    id:String(t.id??('t'+i)),name:String(t.name||`팀 ${i+1}`).slice(0,24),

    locks:Object.fromEntries(POS.map(P=>[P.k,!!t.locks?.[P.k]])),
    sub:ids.has(t.sub)?t.sub:null
  }));

  return o;
}

/* ---------- 팀 대항전 시즌 ----------
   진행 중 시즌 = S 그대로 · 마감한 시즌 = S.ts.arch[k] 스냅샷.
   마감 시즌을 볼 때는 팀 대항전 탭에서만 S를 스냅샷 합친 뷰로 잠깐 바꿔서 렌더·조작하고, 저장은 commit이 스냅샷에 되돌려 씀 */
function defTS(){return{cur:'s2',list:[{k:'s2',n:'시즌2',done:false}],arch:{}}}
function normArch(a){const n=normalize({...a,v:4});return Object.fromEntries(AF.map(f=>[f,n[f]]))}
function normTS(t){
  if(!t||typeof t!=='object'||!Array.isArray(t.list))return defTS();
  const list=t.list.filter(x=>x&&/^s\d+$/.test(x.k)).map(x=>({k:x.k,n:String(x.n||x.k).slice(0,20),done:!!x.done}));
  if(!list.length)return defTS();
  const cur=list.some(x=>x.k===t.cur&&!x.done)?t.cur:(list.find(x=>!x.done)||list[list.length-1]).k;
  const arch={};list.forEach(x=>{if(x.done&&x.k!==cur&&t.arch?.[x.k])arch[x.k]=normArch(t.arch[x.k])});
  return{cur,list,arch};
}

const adjIcons=p=>p.adj.map(id=>adjOf(id)?.e||'').join('');
const totalBase=p=>baseOf(p)+adjSum(p);
const laneBase=(p,k)=>Number.isFinite(p.ps?.[k])?p.ps[k]:baseOf(p);
const r1=x=>Math.round(x*10)/10;
const mainOf=p=>p.pos?.[0]||'';

function fit(p,k){
  if(!p.active)return{l:'불참',c:'f-out',rank:6};
  if(p.no.includes(k))return{l:'🚫 불가',c:'f-out',rank:5};
  if(!p.pos.length)return{l:'지망 미정',c:'f-none',rank:2};
  const i=p.pos.indexOf(k);
  if(i===0)return{l:'1지망',c:'f-1',rank:0};
  if(i>0)return{l:`${i+1}지망`,c:'f-2',rank:1};

function stats(){
  const tots=S.teams.map(teamTotal);
  const full=S.teams.length>0&&S.teams.every(t=>POS.every(P=>player(t.slots[P.k])));
  const mx=tots.length?Math.max(...tots):0,mn=tots.length?Math.min(...tots):0;
  let placed=0,withPref=0,first=0,off=0;
  S.teams.forEach(t=>POS.forEach(P=>{const p=player(t.slots[P.k]);if(!p)return;placed++;const f=fit(p,P.k);if(p.pos.length)withPref++;if(f.rank===0)first++;if(f.rank>=3)off++}));
  return{tots,full,diff:mx-mn,max:mx,min:mn,avg:tots.length?tots.reduce((a,b)=>a+b,0)/tots.length:0,
    over:tots.filter(v=>v>S.cap).length,placed,first,off,firstPct:withPref?Math.round(first/withPref*100):null};
}

/* ---------- 자동 밸런스 (시뮬레이티드 어닐링) ---------- */
function autoBalance(){
  const pool=S.players.filter(p=>p.active);
  if(!pool.length){toast('출전 체크된 멤버가 없어요 😢','err');return null}
  return balanceCore(S.teams,pool,S.cap,{score:0.35,balance:1.4,pos:4.5}[S.mode]);
}
function balanceCore(teams,pool,cap,W){
  const T=teams.length,pmap=new Map(pool.map(p=>[p.id,p]));
  const slots=[],lockedIds=new Set();
  teams.forEach((tm,t)=>POS.forEach(P=>{const id=tm.slots[P.k],lk=tm.locks?.[P.k]&&id!=null&&pmap.has(id);slots.push({t,pos:P.k,lock:lk?id:null});if(lk)lockedIds.add(id)}));
  const open=slots.map((_,i)=>i).filter(i=>slots[i].lock==null);
  const free=pool.filter(p=>!lockedIds.has(p.id)).map(p=>p.id);
  const N=Math.max(open.length,free.length),items=free.slice();while(items.length<N)items.push(null);
  const base=Array(T).fill(0);slots.forEach(s=>{if(s.lock!=null)base[s.t]+=pScore(pmap.get(s.lock),s.pos)});
  const penOf=(p,k)=>{if(p.no.includes(k))return 60;if(!p.pos.length)return 0.8;const i=p.pos.indexOf(k);return i<0?7:[0,1,2.5,3.5,4.5][i]??5};
  const cS=new Map(),cP=new Map();
  free.forEach(id=>{const p=pmap.get(id);cS.set(id,POS.map(P=>pScore(p,P.k)));cP.set(id,POS.map(P=>penOf(p,P.k)))});
  const oT=open.map(i=>slots[i].t),oP=open.map(i=>POS.findIndex(P=>P.k===slots[i].pos));
  const OL=open.length,tot=new Array(T);
  const cost=arr=>{
    for(let i=0;i<T;i++)tot[i]=base[i];let pen=0;
    for(let j=0;j<OL;j++){const id=arr[j];if(id==null)continue;tot[oT[j]]+=cS.get(id)[oP[j]];pen+=cP.get(id)[oP[j]]}
    let mx=-1e9,mn=1e9,sum=0;for(let i=0;i<T;i++){const v=tot[i];if(v>mx)mx=v;if(v<mn)mn=v;sum+=v}
    const avg=sum/T;let sq=0,ov=0;for(let i=0;i<T;i++){const v=tot[i];sq+=(v-avg)*(v-avg);if(v>cap)ov+=40+(v-cap)*(v-cap)*30}
    return(mx-mn)*(mx-mn)*2.5+sq+ov+pen*W;
  };
  let best=null,bestC=Infinity;
  for(let r=0;r<8;r++){
    const arr=shuffle(items.slice());let c=cost(arr);const IT=22000;
    for(let it=0;it<IT;it++){
      const temp=25*Math.pow(0.0004,it/IT),i=rnd(N),j=rnd(N);
      if(i===j||(i>=OL&&j>=OL)||arr[i]===arr[j])continue;
      let x=arr[i];arr[i]=arr[j];arr[j]=x;const c2=cost(arr);
      if(c2<=c||Math.random()<Math.exp((c-c2)/temp)){c=c2;if(c<bestC-1e-9){bestC=c;best=arr.slice()}}
      else{x=arr[i];arr[i]=arr[j];arr[j]=x}
    }
    if(c<bestC){bestC=c;best=arr.slice()}
  }
  return{apply:()=>open.forEach((si,j)=>{const s=slots[si];teams[s.t].slots[s.pos]=best[j]??null})};
}

function dday(){
  const st=Date.parse(S.meta.start+'T00:00:00Z'),en=Date.parse(S.meta.end+'T00:00:00Z'),td=kstToday();
  if(!Number.isFinite(st)||!Number.isFinite(en))return{t:'-',pct:0};
  const total=(en-st)/864e5+1;
  if(td<st)return{t:`시작까지 D-${(st-td)/864e5}`,pct:0};
  if(td>en)return{t:'시즌 종료 🏁',pct:100};
  const left=(en-td)/864e5;
  return{t:left===0?'D-DAY 🔥':`D-${left}`,pct:Math.round(((td-st)/864e5+1)/total*100)};
}

async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    let w=img.naturalWidth,h=img.naturalHeight;const maxW=1600,maxH=4200;
    const k=Math.min(1,maxW/w,maxH/h);w=Math.round(w*k);h=Math.round(h*k);
    const LIMIT=880000;
    for(let scale=1;scale>=0.45;scale-=0.15){
      const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);
      const x=c.getContext('2d');x.fillStyle='#05080f';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      for(const q of [0.9,0.82,0.72,0.62]){const d=c.toDataURL('image/jpeg',q);if(d.length<=LIMIT)return{data:d,w:c.width,h:c.height,kb:Math.round(d.length*0.75/1024)}}
    }
    throw new Error('too big');
  }finally{URL.revokeObjectURL(url)}
}

function sheetRows(){
  const list=S.players.filter(p=>UI.ls.only==='all'||p.active);
  const bySc=(a,b)=>totalBase(b)-totalBase(a)||nameSort(a,b);
  const rows=[];let rk=0;
  if(UI.ls.sort==='pos'){
    POS.forEach(P=>{const g=list.filter(p=>p.pos[0]===P.k).sort(bySc);if(g.length){rows.push({g:`${P.e} ${P.n} · 1지망 ${g.length}명`});g.forEach(p=>rows.push({p,rk:++rk}))}});
    const g=list.filter(p=>!p.pos.length).sort(bySc);if(g.length){rows.push({g:`❔ 지망 미정 · ${g.length}명`});g.forEach(p=>rows.push({p,rk:++rk}))}
  }else{

}
function cellVals(p,rk){
  const t=tierOf(p),as=adjSum(p),v={};
  v.rk={t:rk};v.name={t:nmT(p)};v.tier={t:t?t.n:'직접 입력'};v.ts={t:baseOf(p)};
  v.adj={t:p.adj.length?`${adjIcons(p)} ${sgn(as)}`:'-'};v.tot={t:totalBase(p)};
  v.pref={t:p.pos.length?`${PK[p.pos[0]].e} ${p.pos.slice(0,2).map(k=>PK[k].n).join('·')}`:'미정'};
  POS.forEach(P=>{const no=p.no.includes(P.k),i=p.pos.indexOf(P.k);v[P.k]={t:no?'✕':pScore(p,P.k),c:no?'no':i===0?'p1':i===1?'p2':i>1?'p3':''}});
  v.act={t:p.active?'✅':'💤'};
  return v;
}

/* 캔버스로 직접 그리는 PNG (외부 라이브러리 없음) */
async function makePNG(){
  try{await document.fonts?.ready}catch(e){}
  const rows=sheetRows(),W=880,P=22,RH=32,GH=30,HH=84,TH=30,dpr=2;
  const FF='Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
  const F=(w,s)=>`${w} ${s}px ${FF}`;
  const c=document.createElement('canvas'),x=c.getContext('2d');
  x.font=F(700,11.5);
  const wrap=(t,mw)=>{const out=[];let line='';for(const part of t.split('  ·  ')){const s=line?line+'  ·  '+part:part;if(x.measureText(s).width>mw&&line){out.push(line);line=part}else line=s}if(line)out.push(line);return out};
  const foot=wrap(footPlain(),W-2*P);
  const bodyH=rows.reduce((a,r)=>a+(r.g?GH:RH),0);
  const H=P+HH+TH+bodyH+16+foot.length*18+P;
  c.width=W*dpr;c.height=H*dpr;x.scale(dpr,dpr);
  const bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0f1d33');bg.addColorStop(.55,'#070d19');bg.addColorStop(1,'#1b0f1f');
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
  // 헤더
  const img=new Image();img.src=LOGO;try{await img.decode()}catch(e){}
  x.save();rr(P,P+6,56,56,16);x.clip();try{x.drawImage(img,P,P+6,56,56)}catch(e){}x.restore();
  const tg=x.createLinearGradient(P+70,0,P+250,0);tg.addColorStop(0,'#f3dca4');tg.addColorStop(.5,'#c8aa6e');tg.addColorStop(1,'#6ff7ea');
  x.textBaseline='middle';x.fillStyle=tg;x.font=F(900,24);
  if('letterSpacing' in x)x.letterSpacing='1px';x.fillText('롤가다',P+72,P+24);if('letterSpacing' in x)x.letterSpacing='0px';
  x.fillStyle='#c5d1e2';x.font=F(800,13);x.fillText(`${S.meta.name} 멤버 점수표 · ${SORT_L[UI.ls.sort]}${UI.ls.only==='active'?' · 출전자만':''}`,P+72,P+50);
  x.textAlign='right';x.fillStyle='#8796ad';x.font=F(800,12);
  x.fillText(`${todayStr()} 기준`,W-P,P+22);x.fillText(`총 ${S.players.length}명 · 출전 ${S.players.filter(p=>p.active).length}명`,W-P,P+42);x.textAlign='left';
  x.fillStyle='rgba(200,170,110,.3)';x.fillRect(P,P+HH-8,W-2*P,1);
  // 열 위치
  let cx=P;const cols=SH_COLS.map(cl=>{const o={...cl,x:cx};cx+=cl.w;return o});
  const ell=(t,mw)=>{t=String(t);if(x.measureText(t).width<=mw)return t;while(t.length&&x.measureText(t+'…').width>mw)t=t.slice(0,-1);return t+'…'};
  const cell=(cl,t,y,font,color)=>{x.font=font;x.fillStyle=color;const pad=5,mw=cl.w-pad*2;const s=ell(t,mw);
    if(cl.l){x.textAlign='left';x.fillText(s,cl.x+pad,y)}else{x.textAlign='center';x.fillText(s,cl.x+cl.w/2,y)}};
  let y=P+HH;
  cols.forEach(cl=>cell(cl,cl.h,y+TH/2,F(800,11),'#8796ad'));
  x.fillStyle='rgba(255,255,255,.08)';x.fillRect(P,y+TH-1,W-2*P,1);
  y+=TH;let zebra=0;
  for(const r of rows){
    if(r.g){x.textAlign='left';x.font=F(900,12.5);x.fillStyle='#6ff7ea';x.fillText(r.g,P+5,y+GH/2+4);x.fillStyle='rgba(10,200,185,.3)';x.fillRect(P,y+GH-1,W-2*P,1);y+=GH;zebra=0;continue}
    const v=cellVals(r.p,r.rk);
    if(zebra++%2){x.fillStyle='rgba(255,255,255,.025)';x.fillRect(P,y,W-2*P,RH)}
    x.globalAlpha=r.p.active?1:.42;
    cols.forEach(cl=>{const it=v[cl.k],my=y+RH/2;
      if(cl.k==='name'){const pad=5,xx=cl.x+pad,mw=cl.w-pad*2;x.textAlign='left';
        x.font=F(900,13.5);const nm=ell(r.p.name,r.p.title?mw*.55:mw);x.fillStyle='#eaf1fb';x.fillText(nm,xx,my);
        if(r.p.title){const nx=xx+x.measureText(nm).width+6;x.font=F(900,10.5);const tt=ell(r.p.title,cl.x+cl.w-pad-nx-10);const tw=x.measureText(tt).width+10;
          const col=(TC.find(c=>c.k===(r.p.tc||''))||TC[0]).h;
          if(r.p.tc){x.fillStyle=col}else{const gg=x.createLinearGradient(nx,0,nx+tw,0);gg.addColorStop(0,'#f3dca4');gg.addColorStop(1,'#c8aa6e');x.fillStyle=gg}
          rr(nx,my-9,tw,18,5);x.fill();x.fillStyle=TC_TXT[r.p.tc||''];x.fillText(tt,nx+5,my+.5)}
        return}
      if(cl.lane){
        if(it.c==='p1'||it.c==='p2'){x.fillStyle=it.c==='p1'?'#ff3b52':'rgba(255,204,51,.22)';rr(cl.x+7,my-11,cl.w-14,22,7);x.fill()}
        cell(cl,it.t,my,F(it.c==='p1'||it.c==='p2'?900:800,13),it.c==='p1'?'#ffffff':it.c==='p2'?'#ffd84d':it.c==='p3'?'#7cc8ff':it.c==='no'?'#5c6b82':'#eaf1fb');return}
      const st={rk:[F(800,12),'#8796ad'],name:[F(900,13.5),'#eaf1fb'],tier:[F(700,12),'#b9c6da'],ts:[F(800,13),'#eaf1fb'],adj:[F(800,12),'#eaf1fb'],tot:[F(900,15),'#f3dca4'],pref:[F(800,12.5),'#eaf1fb'],act:[F(800,12),'#eaf1fb']}[cl.k];
      cell(cl,it.t,my,st[0],st[1]);
    });
    x.globalAlpha=1;x.fillStyle='rgba(255,255,255,.045)';x.fillRect(P,y+RH-1,W-2*P,1);y+=RH;
  }
  y+=16;x.textAlign='left';x.font=F(700,11.5);x.fillStyle='#8796ad';foot.forEach((l,i)=>x.fillText(l,P,y+i*18+6));
  return c.toDataURL('image/png');
}

const BO_OPTS=[[1,'단판'],[3,'3판 2선승'],[5,'5판 3선승'],[7,'7판 4선승']];

const mScore=m=>{let a=0,b=0;(m.sets||[]).forEach(x=>{if(x.w==='a')a++;else if(x.w==='b')b++});return{a,b}};
const mWin=(m,bo)=>{if(!m.a||!m.b)return null;const{a,b}=mScore(m),n=needW(bo);return a>=n?m.a:b>=n?m.b:null};
function normLeague(L0){
  if(!L0||typeof L0!=='object')return null;
  const nm=(m,i,j)=>({id:String(m.id||`m${i}_${j}`),a:m.a??null,b:m.b??null,at:num(m.at,0),sets:Array.isArray(m.sets)?m.sets.filter(x=>x&&(x.w==='a'||x.w==='b')).slice(0,7).map(x=>({w:x.w,t:Math.max(0,num(x.t,0))})):[]});
  if(Array.isArray(L0.rounds))return{ids:Array.isArray(L0.ids)?L0.ids:[],timeRule:L0.timeRule==='long'?'long':'short',
    rounds:L0.rounds.map((r,i)=>({id:String(r.id||'r'+i),name:String(r.name||`ROUND ${i+1}`).slice(0,24),type:r.type==='playoff'?'playoff':'league',bo:[1,3,5,7].includes(+r.bo)?+r.bo:1,matches:(Array.isArray(r.matches)?r.matches:[]).map((m,j)=>nm(m,i,j))}))};
  const ms=Array.isArray(L0.matches)?L0.matches:[],rs=[...new Set(ms.map(m=>m.r))].sort((a,b)=>a-b);
  return{ids:Array.isArray(L0.ids)?L0.ids:[],timeRule:'short',rounds:rs.map(r=>({id:'r'+r,name:`ROUND ${r}`,type:'league',bo:1,
    matches:ms.filter(m=>m.r===r).map((m,j)=>({id:`m${r}_${j}`,a:m.a,b:m.b,sets:m.w?[{w:m.w===m.a?'a':'b',t:0}]:[]}))}))};
}

function leagueTable(){
  const LG=S.league;if(!LG)return[];
  const lr=LG.rounds.filter(r=>r.type==='league');
  const ids=[...new Set([...LG.ids,...lr.flatMap(r=>r.matches.flatMap(m=>[m.a,m.b]))].filter(Boolean))];
  const rec=Object.fromEntries(ids.map(id=>[id,{id,p:0,w:0,l:0,sw:0,sl:0,wt:0,wn:0,left:0}]));
  const h2h={};
  lr.forEach(r=>r.matches.forEach(m=>{if(!m.a||!m.b||!rec[m.a]||!rec[m.b])return;
    const sc=mScore(m),w=mWin(m,r.bo);

/* =========================================================
   IndexedDB (영상 캐시)
   ========================================================= */
const idb=(()=>{let p=null;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('lolgada',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv',mode),q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return{get:k=>run('readonly',s=>s.get(k)),set:(k,v)=>run('readwrite',s=>s.put(v,k)),del:k=>run('readwrite',s=>s.delete(k))}})();

  await Promise.all(list.map(async key=>{for(let t=0;t<3;t++){try{await fs.deleteDoc(fs.doc(db,FB_DOC_V[0],FB_DOC_V[1],'chunks',key));return}catch(e){await new Promise(r=>setTimeout(r,400*(t+1)))}}failed.push(key)}));

async function hashPin(pin){
  const data=new TextEncoder().encode('lolgada-s4::'+pin);
  if(window.crypto?.subtle){const h=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  let h=2166136261;for(const b of data){h^=b;h=Math.imul(h,16777619)>>>0}return'f'+h.toString(16);
}

$('#impf').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.players))throw 0;ask('⬆️ 백업 불러오기',`'${esc(f.name)}' 내용으로 덮어쓸까요?\n(멤버 ${d.players.length}명)`,()=>commit(()=>{const pin=S.pinHash;S=normalize(d);if(!S.pinHash)S.pinHash=pin;SEL=null;toast('✅ 불러오기 완료!')}),'덮어쓰기')}catch(_){toast('올바른 백업 파일이 아니에요 😢','err')}};
  r.readAsText(f,'utf-8');e.target.value='';
});
$('#boardf').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)handleBoardFile(f)});
$('#vidf').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!f.type.startsWith('video/'))return toast('영상 파일만 올릴 수 있어요','err');
  VUP={file:f,title:VID.meta?.title||'',step:'ready',prog:0,dur:0,canRaw:false};const tv=document.createElement('video');tv.preload='auto';tv.muted=true;tv.src=URL.createObjectURL(f);
  tv.onloadeddata=()=>{if(VUP&&VUP.file===f){VUP.dur=tv.duration;VUP.canRaw=f.size<=24*1048576&&tv.videoWidth>0&&/mp4|webm/.test(f.type);if(VUP.step==='ready')videoModal()}URL.revokeObjectURL(tv.src)};
  tv.onerror=()=>URL.revokeObjectURL(tv.src);videoModal()});
$('#recf').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)openRecUpload(fs)});
document.addEventListener('dragover',e=>{const z=e.target.closest?.('#boardDrop');if(z&&canEdit()&&e.dataTransfer?.types?.includes('Files')){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest?.('#boardDrop');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest?.('#boardDrop');if(!z||!e.dataTransfer?.files?.length)return;e.preventDefault();z.classList.remove('over');handleBoardFile(e.dataTransfer.files[0])});
/* 드래그 앤 드롭 (PC) */
let dropped=false;
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag]');if(!el)return;if(!canEdit()){e.preventDefault();toast(RO_MSG,'err');return}
  SEL=JSON.parse(el.dataset.drag);dropped=false;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','lolgada')}catch(_){}});
document.addEventListener('dragover',e=>{if(SEL&&e.target.closest('[data-drop]')){e.preventDefault();e.dataTransfer.dropEffect='move'}});
document.addEventListener('drop',e=>{const el=e.target.closest('[data-drop]');if(!el||!SEL)return;e.preventDefault();dropped=true;const d=el.dataset.drop;
  if(d==='bench'&&SEL.k==='bench'){SEL=null;return}
  if(d==='bench'){const chip=e.target.closest('[data-a="benchp"]');pick(chip?{k:'bench',id:+chip.dataset.id}:{k:'benchArea'})}
  else{const[t,pos]=d.split(':');pick({k:'slot',t:+t,pos})}});
document.addEventListener('dragend',()=>{if(!dropped&&SEL)SEL=null});

/* ---------- 시작 ---------- */
saveLocal();
render();
if(L.sync)startSync();
</script>
<script src="games.js"></script>
<script src="members.js"></script>
<script src="draft.js"></script>
</body>
</html>
